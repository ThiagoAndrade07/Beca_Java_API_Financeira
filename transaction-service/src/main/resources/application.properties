spring.application.name=transaction-service

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${TRANSACTION_DB_HOST:localhost}:${TRANSACTION_DB_PORT:5435}/${TRANSACTION_POSTGRES_DB}
spring.datasource.username=${TRANSACTION_POSTGRES_USER}
spring.datasource.password=${TRANSACTION_POSTGRES_PASSWORD}

clients.account-api.base-url=${MOCK_API_BASE_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

clients.user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8081}

server.port=8082