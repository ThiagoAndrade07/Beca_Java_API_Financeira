services:
  postgres:
    image: postgres:17-alpine
    container_name: beca-java-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  transaction-postgres:
    image: postgres:17-alpine
    container_name: beca-java-transaction-postgres
    environment:
      POSTGRES_DB: ${TRANSACTION_POSTGRES_DB}
      POSTGRES_USER: ${TRANSACTION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TRANSACTION_POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - transaction_postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  transaction_postgres_data: